experiment_name: full_matrix
scenario_selectors:
  - attack/*
repeats: 1
resume: false
environment:
  backend: auto
  keep_running: true
  start_bridge: true
  loop_sleep_sec: 0.05
conditions:
  - name: agentic_agents
    profiles:
      attacker: agentic_attacker
      defender: agentic_defender
      observer: agentic_observer
      planner: agentic_planner
      operator: agentic_operator
      offline_analysis: agentic_offline_analyst
