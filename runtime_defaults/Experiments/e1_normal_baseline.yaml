experiment_name: e1_normal_baseline
scenario_selectors:
  - normal/wt-uc1-nominal-startup
  - normal/wt-uc1-long-nominal-run
  - normal/wt-p2-multi-dosing
repeats: 1
resume: false
environment:
  backend: auto
  keep_running: true
  start_bridge: true
  loop_sleep_sec: 0.05
conditions:
  - name: environment_only
    profiles:
      attacker: scripted_attacker
      defender: silent_defender
      observer: silent_observer
      planner: scripted_planner
      operator: scripted_operator
      offline_analysis: scripted_offline_analyst
  - name: monitored_nominal
    profiles:
      attacker: scripted_attacker
      defender: scripted_defender
      observer: scripted_observer
      planner: scripted_planner
      operator: scripted_operator
      offline_analysis: scripted_offline_analyst
