scenario_id: "wt-readiness-p2-hcl-dosing"
process_id: "WT-P2"
description: "Readiness: verify HCl manual dosing path and clean reset"
duration_sec: 100
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 5
    action: { process_id: WT-P1, type: hmi_start }
  - time_sec: 8
    action: { process_id: WT-P2, type: select_process, active: true }
  - time_sec: 10
    action: { process_id: WT-P2, type: set_manual_valve, chemical: HCl, open: true }
  - time_sec: 34
    action: { process_id: WT-P2, type: set_manual_valve, chemical: HCl, open: false }
  - time_sec: 40
    action: { process_id: WT-P2, type: select_process, active: false }
  - time_sec: 56
    action: { process_id: WT-P1, type: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING]
  must_change:
    - ChemTreat_HCl_Level
  ever_nonzero:
    - ChemTreat_HCl_Valve_Sts
  min_samples: 140
  final_equals:
    ChemTreat_HCl_Valve_Sts: 0
    P2_Selected: 0
    RW_Pump_Sts: 0

