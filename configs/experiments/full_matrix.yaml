experiment_name: full_matrix
scenario_selectors:
  - readiness/*
  - normal/*
  - attack/*
  - recheck/*
repeats: 1
resume: true
results_root: ../Results
environment:
  backend: auto
  keep_running: false
  start_bridge: true
role_matrix:
  attacker: [scripted_attacker, agentic_attacker]
  defender: [scripted_defender, agentic_defender]
  observer: [scripted_observer, agentic_observer]
  planner: [scripted_planner, agentic_planner]
  operator: [scripted_operator, agentic_operator]
  offline_analysis: [scripted_offline_analyst, agentic_offline_analyst]
