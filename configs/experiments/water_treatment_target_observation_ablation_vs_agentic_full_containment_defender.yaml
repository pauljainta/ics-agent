experiment_name: water_treatment_target_observation_ablation
experiment_id: water_treatment_target_observation_ablation_vs_agentic_full_containment_defender
testbed: water_treatment
scenario_selectors:
  - attack/*
repeats: 1
resume: true
use_canonical_result_root: true
reproducibility:
  seed: 101
results_root: ../../../Artifact/Results/Water-treatment/target-observation-ablation
study_metadata:
  family: water_treatment_target_observation_ablation
  timing_primary_origin: wargame_t0
  notes:
    - Water Treatment observation ablation for the legacy 18-scenario attack suite.
    - Full target semantics and the legacy white-box interaction interface are fixed in both conditions.
    - The only intended attacker-side capability difference is stateaware_oi.observation_variant.
    - The harmonized process-defender runner patches the defender to process-only full-containment semantics at execution time.
environment:
  backend: sphere_openplc
  testbed: water_treatment
  infrastructure_profile: water_treatment

condition_profiles: &condition_profiles
  attacker: target_semantic_ablation_attacker
  defender: agentic_defender
  observer: agentic_observer
  planner: scripted_planner
  operator: scripted_operator
  offline_analysis: scripted_offline_analyst

frozen_defender_override: &frozen_defender_override
  behavior_model:
    id: optionb_mitre_staged
    policy: agentic
    notes: Frozen active full-containment defender for target-observation ablation.
  allowed_action_types:
    - hmi_stop
    - hmi_estop
    - select_process
    - disable_hmi_session
    - isolate_engineering_host
    - block_sensor_write
    - block_process2_manual_path
    - quarantine_signal_source
    - noop
  llm:
    prompt_file: testbeds/water_treatment/prompts/defender.md
  note_cooldown_sec: 4.0
  reasoning_cooldown_sec: 2.0
  reasoning_refresh_sec: 4.0

frozen_observer_override: &frozen_observer_override
  behavior_model:
    id: optionb_mitre_staged
    policy: agentic
    notes: Frozen treatment observer for target-observation ablation.
  llm:
    prompt_file: testbeds/water_treatment/prompts/observer.md

conditions:
  - name: full_target_semantics_normO_highI__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: full
          interface_variant: legacy_white_interface
        stateaware_oi:
          enabled: true
          condition_name: full_target_semantics_normO_highI__agentic_defender
          observation_variant: normalized_observation
          interface_variant: legacy_white_interface
      defender: *frozen_defender_override
      observer: *frozen_observer_override
  - name: full_target_semantics_highO_highI__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: full
          interface_variant: legacy_white_interface
        stateaware_oi:
          enabled: true
          condition_name: full_target_semantics_highO_highI__agentic_defender
          observation_variant: high_observation
          interface_variant: legacy_white_interface
      defender: *frozen_defender_override
      observer: *frozen_observer_override
