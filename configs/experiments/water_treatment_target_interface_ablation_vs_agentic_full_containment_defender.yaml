experiment_name: water_treatment_target_interface_ablation
experiment_id: water_treatment_target_interface_ablation_vs_agentic_full_containment_defender
testbed: water_treatment
scenario_selectors:
  - attack/*
repeats: 1
resume: true
use_canonical_result_root: true
reproducibility:
  seed: 101
results_root: ../../../Artifact/Results/Water-treatment/target-interface-ablation
study_metadata:
  family: water_treatment_target_interface_ablation
  timing_primary_origin: wargame_t0
  notes:
    - Pre-experiment config only; do not run until the interface-isolation setup has been reviewed.
    - Full target semantics are fixed in both conditions.
    - The only intended attacker-side capability difference is target_semantics.interface_variant.
    - The defender is the same active full-containment agentic defender used by current treatment semantic runs.
environment:
  backend: sphere_openplc
  testbed: water_treatment
  infrastructure_profile: water_treatment

condition_profiles: &condition_profiles
  attacker: target_semantic_ablation_attacker
  defender: agentic_defender
  observer: agentic_observer
  planner: scripted_planner
  operator: scripted_operator
  offline_analysis: scripted_offline_analyst

frozen_defender_override: &frozen_defender_override
  behavior_model:
    id: optionb_mitre_staged
    policy: agentic
    notes: Frozen active full-containment defender for target-interface ablation.
  allowed_action_types:
    - hmi_stop
    - hmi_estop
    - select_process
    - disable_hmi_session
    - isolate_engineering_host
    - block_sensor_write
    - block_process2_manual_path
    - quarantine_signal_source
    - noop
  llm:
    prompt_file: testbeds/water_treatment/prompts/defender.md
  note_cooldown_sec: 4.0
  reasoning_cooldown_sec: 2.0
  reasoning_refresh_sec: 4.0

frozen_observer_override: &frozen_observer_override
  behavior_model:
    id: optionb_mitre_staged
    policy: agentic
    notes: Frozen treatment observer for target-interface ablation.
  llm:
    prompt_file: testbeds/water_treatment/prompts/observer.md

conditions:
  - name: full_target_semantics_normalized_interface__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: full
          interface_variant: normalized_interface
      defender: *frozen_defender_override
      observer: *frozen_observer_override
  - name: full_target_semantics_legacy_white_interface__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: full
          interface_variant: legacy_white_interface
      defender: *frozen_defender_override
      observer: *frozen_observer_override
