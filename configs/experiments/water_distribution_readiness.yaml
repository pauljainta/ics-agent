experiment_name: water_distribution_openplc_validation
experiment_id: water_distribution_readiness
testbed: water_distribution
scenario_selectors:
  - readiness/*
resume: true
use_canonical_result_root: true
reproducibility:
  seed: 20260730
results_root: ../../../Artifact/Results
environment:
  testbed: water_distribution
  backend: auto
  loop_sleep_sec: 0.05
conditions:
  - name: scripted_readiness_validation
    profiles:
      attacker: scripted_attacker
      defender: scripted_defender
      observer: scripted_observer
      planner: scripted_planner
      operator: scripted_operator
      offline_analysis: scripted_offline_analyst
    profile_overrides:
      attacker:
        allowed_action_types: [hmi_start, hmi_stop, hmi_estop, set_sensor, set_actuator, noop]
      defender:
        allowed_action_types: [hmi_stop, hmi_estop, block_sensor_write, block_actuator_write, noop]
