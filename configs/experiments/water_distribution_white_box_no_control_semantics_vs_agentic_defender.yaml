experiment_name: water_distribution_openplc_white_box_no_control_semantics
experiment_id: water_distribution_white_box_no_control_semantics_vs_agentic_defender
testbed: water_distribution
scenario_selectors:
  - attack/*
resume: true
use_canonical_result_root: true
reproducibility:
  seed: 101
results_root: ../../../Artifact/Results
study_metadata:
  family: water_distribution_white_box_no_control_semantics_vs_agentic_defender
  timing_primary_origin: attack_start
  notes:
    - Water-distribution white-box attacker ablation with control semantics removed
    - Current agentic defender, action space, and containment semantics remain unchanged
environment:
  backend: sphere_openplc
  testbed: water_distribution
  infrastructure_profile: water_distribution
conditions:
  - name: white_box_no_control_semantics__agentic_defender
    profiles:
      attacker: white_box_attacker
      defender: agentic_defender
      observer: scripted_observer
      planner: scripted_planner
      operator: scripted_operator
      offline_analysis: scripted_offline_analyst
    profile_overrides:
      attacker:
        behavior_model:
          id: optionb_mitre_staged
          policy: agentic
          notes: MITRE-informed staged water-distribution white-box attacker with control semantics removed
        allowed_action_types:
          - inspect_surface
          - hmi_start
          - hmi_stop
          - hmi_estop
          - set_sensor
          - set_actuator
          - noop
        white_box_knowledge_ablation: no_control_semantics
        knowledge_files:
          - testbeds/water_distribution/knowledge/white_box_no_control_semantics_attacker_manual.md
        abort_on_backend_error: false
        action_cooldown_sec: 0.5
        note_cooldown_sec: 2.0
        reasoning_cooldown_sec: 1.0
        reasoning_refresh_sec: 2.0
        memory:
          attacker_candidate_window: 8
        llm:
          backend: qwen_langgraph
          prompt_file: testbeds/water_distribution/prompts/white_box_attacker_ablation.md
          use_langgraph: true
          strict_backend: true
          allow_langchain_fallback: true
          max_new_tokens: 160
      defender:
        allowed_action_types:
          - hmi_stop
          - hmi_estop
          - disable_hmi_session
          - isolate_engineering_host
          - block_sensor_write
          - block_actuator_write
          - quarantine_signal_source
          - noop
        knowledge_files:
          - testbeds/water_distribution/knowledge/shared_testbed_manual.md
          - testbeds/water_distribution/knowledge/defender_manual.md
        abort_on_backend_error: false
        action_cooldown_sec: 2.0
        note_cooldown_sec: 12.0
        reasoning_cooldown_sec: 12.0
        reasoning_refresh_sec: 18.0
        llm:
          backend: qwen_langchain
          prompt_file: testbeds/water_distribution/prompts/defender.md
          use_langgraph: false
          allow_langchain_fallback: false
          max_new_tokens: 48
