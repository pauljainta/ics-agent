experiment_name: WaterTreatmentAutonomousReactWhiteBox
experiment_id: WaterTreatmentAutonomousReactWhiteBox
testbed: water_treatment
scenario_selectors:
  - attack/*
repeats: 1
resume: true
use_canonical_result_root: true
reproducibility:
  seed: 101
results_root: ../../../Artifact/Results/Water-treatment/Autonomous-React/White-Box
study_metadata:
  family: water_treatment_white_box_autonomous_react_attacker_vs_agentic_full_containment_defender_mitre18
  timing_primary_origin: wargame_t0
  notes:
    - Full 18-scenario water-treatment run for the bounded autonomous ReAct white-box attacker.
    - The attacker starts from bounded post-access context and must inspect reachable surfaces before manipulating the process.
    - The defender is the current full-containment agentic defender with runtime-enforced cutoff actions.
    - Infrastructure coordinates must come from ignored local environment or infrastructure config.
environment:
  backend: sphere_openplc
  testbed: water_treatment
  infrastructure_profile: water_treatment
environment_runtime:
  io_timeout_sec: 8
conditions:
  - name: white_box_autonomous_react_attacker__agentic_defender
    profiles:
      attacker: white_box_autonomous_react_attacker
      defender: agentic_defender
      observer: agentic_observer
      planner: scripted_planner
      operator: scripted_operator
      offline_analysis: scripted_offline_analyst
    profile_overrides:
      attacker:
        react_context_mode: compact
        max_llm_decisions_per_episode: 10
        llm:
          model_id: Qwen/Qwen3.5-9B
          prompt_file: testbeds/water_treatment/prompts/white_box_attacker.md
          quantization: 4bit
          max_new_tokens: 128
        action_cooldown_sec: 0.5
        note_cooldown_sec: 2.0
        reasoning_cooldown_sec: 0.5
        reasoning_refresh_sec: 1.0
      defender:
        behavior_model:
          id: optionb_mitre_staged
          policy: agentic
          notes: MITRE-informed staged agentic defender with concrete runtime containment.
        allowed_action_types:
          - hmi_stop
          - hmi_estop
          - select_process
          - disable_hmi_session
          - isolate_engineering_host
          - block_sensor_write
          - block_process2_manual_path
          - quarantine_signal_source
          - noop
        llm:
          model_id: Qwen/Qwen3.5-9B
          prompt_file: testbeds/water_treatment/prompts/defender.md
          quantization: 4bit
          max_new_tokens: 128
        action_cooldown_sec: 1.0
        note_cooldown_sec: 4.0
        reasoning_cooldown_sec: 2.0
        reasoning_refresh_sec: 4.0
      observer:
        behavior_model:
          id: optionb_mitre_staged
          policy: agentic
          notes: MITRE-informed staged agentic observer.
        llm:
          model_id: Qwen/Qwen3.5-9B
          prompt_file: testbeds/water_treatment/prompts/observer.md
          quantization: 4bit
          max_new_tokens: 128
