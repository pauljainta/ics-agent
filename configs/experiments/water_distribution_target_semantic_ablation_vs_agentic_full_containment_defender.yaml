experiment_name: water_distribution_target_semantic_ablation
experiment_id: water_distribution_target_semantic_ablation_vs_agentic_full_containment_defender
testbed: water_distribution
scenario_selectors:
  - attack/*
repeats: 1
resume: true
use_canonical_result_root: true
reproducibility:
  seed: 101
results_root: ../../../Artifact/Results/water_distribution_openplc/target-semantic-ablation
study_metadata:
  family: water_distribution_target_semantic_ablation
  timing_primary_origin: wargame_t0
  notes:
    - Pre-experiment config only; do not run until the semantic-isolation setup has been reviewed.
    - All attacker capabilities are fixed except target_semantics.variant.
    - The defender is the same active full-containment agentic defender used by current distribution runs.
environment:
  backend: sphere_openplc
  testbed: water_distribution
  infrastructure_profile: water_distribution

condition_profiles: &condition_profiles
  attacker: target_semantic_ablation_attacker
  defender: agentic_defender
  observer: scripted_observer
  planner: scripted_planner
  operator: scripted_operator
  offline_analysis: scripted_offline_analyst

frozen_defender_override: &frozen_defender_override
  allowed_action_types:
    - hmi_stop
    - hmi_estop
    - disable_hmi_session
    - isolate_engineering_host
    - block_sensor_write
    - block_actuator_write
    - quarantine_signal_source
    - noop
  knowledge_files:
    - testbeds/water_distribution/knowledge/shared_testbed_manual.md
    - testbeds/water_distribution/knowledge/defender_manual.md
  abort_on_backend_error: false
  action_cooldown_sec: 2.0
  note_cooldown_sec: 12.0
  reasoning_cooldown_sec: 12.0
  reasoning_refresh_sec: 18.0
  llm:
    backend: qwen_langchain
    prompt_file: testbeds/water_distribution/prompts/defender.md
    use_langgraph: false
    allow_langchain_fallback: false
    max_new_tokens: 48

conditions:
  - name: no_target_semantics__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: no_target_semantics
      defender: *frozen_defender_override
  - name: topology_only__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: topology_only
      defender: *frozen_defender_override
  - name: asset_only__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: asset_only
      defender: *frozen_defender_override
  - name: control_effect_only__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: control_effect_only
      defender: *frozen_defender_override
  - name: safety_only__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: safety_only
      defender: *frozen_defender_override
  - name: surface_only__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: surface_only
      defender: *frozen_defender_override
  - name: full_target_semantics__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: full
      defender: *frozen_defender_override
  - name: irrelevant_context__agentic_defender
    profiles: *condition_profiles
    profile_overrides:
      attacker:
        target_semantics:
          variant: irrelevant_context
      defender: *frozen_defender_override
