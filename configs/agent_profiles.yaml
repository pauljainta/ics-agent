  scripted_defender:
    role: defender
    family: scripted
    mode: online
    allowed_action_types: [hmi_stop, hmi_estop, select_process, noop]
  scripted_defender_optionb_mitre:
    role: defender
    family: scripted
    mode: online
    allowed_action_types: [hmi_stop, hmi_estop, select_process, noop]
    behavior_model:
      id: optionb_mitre_staged
      policy: scripted
      notes: Fixed-threshold MITRE-informed staged Option B defender
  rule_based_defender:
    role: defender
    family: rule_based
    mode: online
    allowed_action_types: [hmi_stop, hmi_estop, select_process, noop]
    rules:
      - id: rw-low-mitigation
        once_per_run: true
        when:
          any:
            - { field: RW_Tank_Level, below: 450 }
            - { field: Alarm_RW_Tank_LL, equals: 1 }
        alert: Raw-water level low; stop the plant before unsafe operation persists.
        action_summary: Stop WT-P1 because raw-water low condition indicates fault or spoofing.
        diagnosis: raw_water_low_or_spoof
        action: { type: hmi_stop, process_id: WT-P1 }
      - id: rw-high-high
        once_per_run: true
        when:
          any:
            - { field: Alarm_RW_Tank_HH, equals: 1 }
            - { field: RW_Tank_Level, above: 1180 }
        alert: Raw-water tank high-high condition observed.
        action_summary: Emergency stop WT-P1 due to high-high raw-water condition.
        diagnosis: raw_water_alarm_condition
        action: { type: hmi_estop, process_id: WT-P1 }
      - id: p2-unauthorized-dosing
        once_per_run: true
        when:
          all:
            - { field: P2_Selected, equals: 1 }
            - { planned_role_action_absent: { role: operator, action: { process_id: WT-P2, type: select_process, active: true } } }
            - { time_after_sec: 6 }
        alert: Process 2 dosing remains active; deselect when not explicitly planned.
        action_summary: Deselect Process 2 to constrain unauthorized chemical actuation.
        diagnosis: unauthorized_chemical_dosing
        action: { process_id: WT-P2, type: select_process, active: false }
  rule_based_defender_optionb_mitre:
    role: defender
    family: rule_based
    mode: online
    allowed_action_types: [hmi_stop, hmi_estop, select_process, noop]
    behavior_model:
      id: optionb_mitre_staged
      policy: adaptive
      notes: Adaptive MITRE-informed staged Option B defender
  silent_defender:
    role: defender
    family: scripted
    mode: online
    allowed_action_types: [noop]
  agentic_defender:
    role: defender
    family: agentic
    mode: online
