profiles:
  scripted_attacker:
    role: attacker
    family: scripted
    mode: online
    allowed_action_types: [hmi_start, hmi_stop, hmi_estop, select_process, set_manual_valve, set_sensor, noop]
  agentic_attacker:
    role: attacker
    family: agentic
    mode: online
    allowed_action_types: [hmi_start, hmi_stop, hmi_estop, select_process, set_manual_valve, set_sensor, noop]
    llm:
      backend: heuristic
      framework: langchain
      use_langgraph: true
      model_id: Qwen/Qwen3.5-9B
      prompt_file: configs/prompts/attacker.md
    memory:
      observation_window: 8
      decision_window: 8
  scripted_defender:
    role: defender
    family: scripted
    mode: online
    allowed_action_types: [hmi_stop, hmi_estop, select_process, noop]
    rules:
      - id: rw-low-mitigation
        once_per_run: true
        when:
          any:
            - { field: RW_Tank_Level, below: 450 }
            - { field: Alarm_RW_Tank_LL, equals: 1 }
        alert: Raw-water level low; stop the plant before unsafe operation persists.
        action_summary: Stop WT-P1 because raw-water low condition indicates fault or spoofing.
        diagnosis: raw_water_low_or_spoof
        action: { type: hmi_stop, process_id: WT-P1 }
      - id: rw-high-high
        once_per_run: true
        when:
          any:
            - { field: Alarm_RW_Tank_HH, equals: 1 }
            - { field: RW_Tank_Level, above: 1180 }
        alert: Raw-water tank high-high condition observed.
        action_summary: Emergency stop WT-P1 due to high-high raw-water condition.
        diagnosis: raw_water_alarm_condition
        action: { type: hmi_estop, process_id: WT-P1 }
      - id: p2-unauthorized-dosing
        once_per_run: true
        when:
          all:
            - { field: P2_Selected, equals: 1 }
            - { time_after_sec: 6 }
        alert: Process 2 dosing remains active; deselect when not explicitly planned.
        action_summary: Deselect Process 2 to constrain unauthorized chemical actuation.
        diagnosis: unauthorized_chemical_dosing
        action: { process_id: WT-P2, type: select_process, active: false }
  agentic_defender:
    role: defender
    family: agentic
    mode: online
    allowed_action_types: [hmi_stop, hmi_estop, select_process, noop]
    llm:
      backend: heuristic
      framework: langchain
      use_langgraph: true
      model_id: Qwen/Qwen3.5-9B
      prompt_file: configs/prompts/defender.md
    memory:
      observation_window: 12
      decision_window: 12
  scripted_observer:
    role: observer
    family: scripted
    mode: online
    allowed_action_types: [noop]
    rules:
      - id: observer-rw-low
        once_per_run: true
        when:
          any:
            - { field: RW_Tank_Level, below: 450 }
            - { field: Alarm_RW_Tank_LL, equals: 1 }
        alert: Observer flagged a raw-water low condition.
        diagnosis: raw_water_low_or_spoof
      - id: observer-rw-hh
        once_per_run: true
        when:
          any:
            - { field: Alarm_RW_Tank_HH, equals: 1 }
            - { field: RW_Tank_Level, above: 1180 }
        alert: Observer flagged a raw-water high-high condition.
        diagnosis: raw_water_alarm_condition
      - id: observer-p2
        once_per_run: true
        when:
          all:
            - { field: P2_Selected, equals: 1 }
            - { time_after_sec: 6 }
        alert: Observer detected sustained Process 2 actuation.
        diagnosis: unauthorized_chemical_dosing
  agentic_observer:
    role: observer
    family: agentic
    mode: online
    allowed_action_types: [noop]
    llm:
      backend: heuristic
      framework: langchain
      use_langgraph: true
      model_id: Qwen/Qwen3.5-9B
      prompt_file: configs/prompts/observer.md
    memory:
      observation_window: 12
      decision_window: 12
  scripted_planner:
    role: planner
    family: scripted
    mode: online
    allowed_action_types: [noop]
  agentic_planner:
    role: planner
    family: agentic
    mode: online
    allowed_action_types: [noop]
    llm:
      backend: heuristic
      framework: langchain
      use_langgraph: true
      model_id: Qwen/Qwen3.5-9B
      prompt_file: configs/prompts/planner.md
  scripted_operator:
    role: operator
    family: scripted
    mode: online
    allowed_action_types: [hmi_start, hmi_stop, hmi_reset, select_process, set_manual_valve, noop]
  scripted_offline_analyst:
    role: offline_analysis
    family: scripted
    mode: offline
    allowed_action_types: [noop]
  agentic_offline_analyst:
    role: offline_analysis
    family: agentic
    mode: offline
    allowed_action_types: [noop]
    llm:
      backend: heuristic
      framework: langchain
      use_langgraph: true
      model_id: Qwen/Qwen3.5-9B
      prompt_file: configs/prompts/offline_analyst.md

