scenario_id: "wd-stateaware-supply-conditional"
process_id: "WD-Supply"
description: "State-aware attack: choose whether to drive or suppress supply refill based on the current supply-tank headroom."
duration_sec: 56
poll_interval_ms: 500

initial_conditions:
  Supply_Tank_Level: 900
  Supply_NaOCl_Level: 800
  Supply_NH4Cl_Level: 800
  Grid_Elev_Tank_Level: 1200
  Grid_Consum_Tank_Level: 1000
  RWS_Tank_Level: 500

timeline:
  - time_sec: 0
    action: { type: hmi_start, process_id: WD-UC0 }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 50

stateaware:
  observation_dependency: "The useful manipulation depends on whether the supply tank is already near high headroom or near low refill pressure."
  causal_chain: "attacker observes supply state -> chooses refill-driving or refill-suppressing write -> controller-visible supply state changes -> pump/valve behavior changes -> safety envelope evaluation"
  candidate_actions:
    - action: { type: inspect_surface, surface: tags }
      surface: discovery
      category: recon
    - action: { type: inspect_surface, surface: supply_control_plane }
      surface: discovery
      category: recon
    - action: { type: set_sensor, name: Supply_Tank_Level, value: 270 }
      surface: sensor_write_path
      category: manipulation
    - action: { type: set_sensor, name: Supply_Tank_Level, value: 1380 }
      surface: sensor_write_path
      category: manipulation
    - action: { type: set_actuator, name: Supply_Pump_Speed, value: 100 }
      surface: actuator_write_path
      category: manipulation
    - action: { type: set_actuator, name: Supply_Pump_Speed, value: 0 }
      surface: actuator_write_path
      category: manipulation
    - action: { type: set_actuator, name: Supply_Tank_Valve, value: true }
      surface: actuator_write_path
      category: manipulation
    - action: { type: set_actuator, name: Supply_Tank_Valve, value: false }
      surface: actuator_write_path
      category: manipulation
    - action: { type: noop }
      surface: timing
      category: hold
  branches:
    - branch_id: supply_high_refill_drive
      initial_conditions:
        Supply_Tank_Level: 1160
        Grid_Elev_Tank_Level: 1180
        RWS_Tank_Level: 500
      appropriate_actions:
        - { type: set_sensor, name: Supply_Tank_Level, value: 270 }
        - { type: set_actuator, name: Supply_Pump_Speed, value: 100 }
        - { type: set_actuator, name: Supply_Tank_Valve, value: true }
      evaluator_note: "Supply is already high; a low spoof or forced refill path is the state-appropriate way to drive further filling pressure."
    - branch_id: supply_low_refill_suppression
      initial_conditions:
        Supply_Tank_Level: 340
        Grid_Elev_Tank_Level: 1180
        RWS_Tank_Level: 500
      appropriate_actions:
        - { type: set_sensor, name: Supply_Tank_Level, value: 1380 }
        - { type: set_actuator, name: Supply_Pump_Speed, value: 0 }
        - { type: set_actuator, name: Supply_Tank_Valve, value: false }
      evaluator_note: "Supply is near the low band; a high spoof or refill suppression is the state-appropriate way to prevent recovery."
