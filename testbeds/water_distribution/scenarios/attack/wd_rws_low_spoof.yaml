scenario_id: "wd-attack-rws-low-spoof"
process_id: "WD-RWS"
description: "Spoof the return-water tank low so the return pump remains unavailable while the tank rises."
duration_sec: 58
poll_interval_ms: 500

initial_conditions:
  Supply_Tank_Level: 900
  Supply_NaOCl_Level: 800
  Supply_NH4Cl_Level: 800
  Grid_Elev_Tank_Level: 910
  Grid_Consum_Tank_Level: 820
  RWS_Tank_Level: 780

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 16
    action: { type: set_sensor, name: RWS_Tank_Level, value: 90 }
  - { time_sec: 40, action: hmi_stop }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 24

reference_bundle: null
