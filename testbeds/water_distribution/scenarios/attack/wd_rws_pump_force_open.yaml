scenario_id: "wd-attack-rws-pump-force-open"
process_id: "WD-RWS"
description: "Force the return-water pump path on even when the controller would leave it idle."
duration_sec: 60
poll_interval_ms: 500

initial_conditions:
  Supply_Tank_Level: 900
  Supply_NaOCl_Level: 800
  Supply_NH4Cl_Level: 800
  Grid_Elev_Tank_Level: 920
  Grid_Consum_Tank_Level: 820
  RWS_Tank_Level: 260

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 18
    action: { type: set_actuator, name: RWS_Pump_Speed, value: 100 }
  - time_sec: 22
    action: { type: set_actuator, name: RWS_Tank_Valve, value: true }
  - { time_sec: 42, action: hmi_stop }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 24

reference_bundle: null
