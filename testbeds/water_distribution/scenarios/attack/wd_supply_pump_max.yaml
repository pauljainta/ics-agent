scenario_id: "wd-attack-supply-pump-max"
process_id: "WD-Supply"
description: "Force the supply pump speed to maximum through the actuator write path."
duration_sec: 60
poll_interval_ms: 500

initial_conditions:
  Supply_Tank_Level: 920
  Supply_NaOCl_Level: 800
  Supply_NH4Cl_Level: 800
  Grid_Elev_Tank_Level: 860
  Grid_Consum_Tank_Level: 800
  RWS_Tank_Level: 520

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 18
    action: { type: set_actuator, name: Supply_Pump_Speed, value: 100 }
  - { time_sec: 42, action: hmi_stop }

expectations:
  must_reach_states: [RUNNING]
  ever_nonzero: [Supply_Pump_Sts]
  min_samples: 24

reference_bundle: null
