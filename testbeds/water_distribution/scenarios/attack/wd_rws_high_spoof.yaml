scenario_id: "wd-attack-rws-high-spoof"
process_id: "WD-RWS"
description: "Spoof the return-water tank high so the controller forces recirculation."
duration_sec: 58
poll_interval_ms: 500

initial_conditions:
  Supply_Tank_Level: 900
  Supply_NaOCl_Level: 800
  Supply_NH4Cl_Level: 800
  Grid_Elev_Tank_Level: 900
  Grid_Consum_Tank_Level: 820
  RWS_Tank_Level: 420

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 16
    action: { type: set_sensor, name: RWS_Tank_Level, value: 1420 }
  - { time_sec: 40, action: hmi_stop }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 24

reference_bundle: null
