scenario_id: "wd-uc0-supply-hh-alarm"
process_id: "WD-Supply"
description: "Force a supply tank high-high condition and verify alarm surfacing"
duration_sec: 45
poll_interval_ms: 500

initial_conditions:
  Supply_Tank_Level: 1150
  Supply_NaOCl_Level: 800
  Supply_NH4Cl_Level: 800
  Grid_Elev_Tank_Level: 850
  Grid_Consum_Tank_Level: 800
  RWS_Tank_Level: 500

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 12
    action:
      type: set_sensor
      name: Supply_Tank_Level
      value: 1260
  - { time_sec: 28, action: hmi_stop }

expectations:
  must_reach_states: [RUNNING]
  ever_nonzero: [Alarm_Supply_Tank_HH]
  min_samples: 18

reference_bundle: null
