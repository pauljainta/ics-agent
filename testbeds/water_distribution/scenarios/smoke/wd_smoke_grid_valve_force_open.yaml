scenario_id: "wd-smoke-grid-valve-force-open"
process_id: "WD-Grid"
description: "Short smoke case: force the elevated tank inlet valve open"
duration_sec: 36
poll_interval_ms: 500

initial_conditions:
  Supply_Tank_Level: 920
  Supply_NaOCl_Level: 800
  Supply_NH4Cl_Level: 800
  Grid_Elev_Tank_Level: 700
  Grid_Consum_Tank_Level: 820
  RWS_Tank_Level: 520

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 12
    action:
      type: set_actuator
      name: Grid_Elev_Valve
      value: true
  - { time_sec: 24, action: hmi_stop }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 14

reference_bundle: null
