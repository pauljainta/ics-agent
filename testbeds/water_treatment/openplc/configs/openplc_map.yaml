# OpenPLC Backend Mapping: Canonical Tag -> Modbus Address
#
# GENERATED by tools/io_layer.py -- edit the contract or the generator, not this.
#
# ARCHITECTURE: both PLCs are Modbus slaves; tools/fuxa-demo/bridge/bridge.py
# copies registers between them. Modbus cannot write a discrete input or an input
# register, so %IX and %IW can never be fed from outside and are not used here.
# Verified against OpenPLC webserver/core/modbus.cpp:100-129.
#
#   %QX<b>.<n>  coil               = b*8 + n         client read/write
#   %IX<b>.<n>  discrete input     = b*8 + n         READ ONLY - unusable here
#   %QW<n>      holding register   = n               client read/write
#   %IW<n>      input register     = n               READ ONLY - unusable here
#   %MD<n>      holding registers  = 2048 + 2n      client read/write
#
# BOTH PLCs USE THE SAME ADDRESSES. Coils and %MD are read/write for a client,
# so each side declares every tag at one address and only writes the ones it
# owns. The bridge is then a straight address-to-address copy, owner -> peer,
# and there is no second address space to keep in step.
#
# Address blocks (identical on controller and simulator):
#   controller-owned digital   coils 0-84            %QX0.0-%QX10.4
#   simulator-owned digital    coils 160-187         %QX20.0-%QX23.3
#   all analog, both owners    HR 2048-2101        %MD0-26
#
# ANALOG: located as native REAL at %MD, two registers each, high word first.
# dint_memory is the only 32-bit array OpenPLC maps to Modbus, and the glue
# binds it by pointer cast, so the register pair carries raw IEEE-754 bits.
# There is no scaling anywhere - contract REAL maps 1:1 to program REAL.
#
# Anything writing an analog point must update BOTH words together. A torn
# float is garbage, not an approximation.

