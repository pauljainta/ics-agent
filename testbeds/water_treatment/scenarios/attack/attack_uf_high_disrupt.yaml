scenario_id: "wt-attack-sensor-uf-high-disrupt"
process_id: "WT-P1"
description: "Attack: force UF tank level high during runtime to knock the process out of RUNNING"
duration_sec: 40
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 15
    action:
      type: set_sensor
      name: UF_UFFT_Tank_Level
      value: 1000
  - { time_sec: 30, action: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING, START]
  event_count:
    hmi_start: 1
    hmi_stop: 1
  events_lead_to_state:
    hmi_start: RUNNING
    hmi_stop: SHUTDOWN
  min_samples: 60
  final_equals:
    RW_Pump_Sts: 0
    RW_Pump_Flow: 0

reference_bundle: null
