scenario_id: "wt-attack-sensor-uf-high-block"
process_id: "WT-P1"
description: "Attack: spoof UF tank high before startup to block permissives"
duration_sec: 35
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 2
    action:
      type: set_sensor
      name: UF_UFFT_Tank_Level
      value: 1000
  - { time_sec: 5, action: hmi_start }
  - { time_sec: 25, action: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [START]
  must_not_reach_states: [RUNNING]
  event_count:
    hmi_start: 1
    hmi_stop: 1
  events_lead_to_state:
    hmi_start: START
    hmi_stop: SHUTDOWN
  min_samples: 55
  final_equals:
    SYS_Permissives_Ready: 0
    RW_Pump_Sts: 0
    RW_Pump_Flow: 0

reference_bundle: null
