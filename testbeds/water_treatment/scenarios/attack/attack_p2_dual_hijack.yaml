scenario_id: "wt-attack-p2-dual-hijack"
process_id: "WT-P2"
description: "Attack: dual chemical hijack using NaCl and NaOCl manual dosing"
duration_sec: 96
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 5
    action: { process_id: WT-P1, type: hmi_start }
  - time_sec: 8
    action: { process_id: WT-P2, type: select_process, active: true }
  - time_sec: 10
    action: { process_id: WT-P2, type: set_manual_valve, chemical: NaCl, open: true }
  - time_sec: 28
    action: { process_id: WT-P2, type: set_manual_valve, chemical: NaCl, open: false }
  - time_sec: 32
    action: { process_id: WT-P2, type: set_manual_valve, chemical: NaOCl, open: true }
  - time_sec: 50
    action: { process_id: WT-P2, type: set_manual_valve, chemical: NaOCl, open: false }
  - time_sec: 56
    action: { process_id: WT-P2, type: select_process, active: false }
  - time_sec: 70
    action: { process_id: WT-P1, type: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING]
  must_change:
    - ChemTreat_NaCl_Level
    - ChemTreat_NaOCl_Level
  ever_nonzero:
    - ChemTreat_NaCl_Valve_Sts
    - ChemTreat_NaOCl_Valve_Sts
  event_count:
    hmi_start: 1
    hmi_stop: 1
  min_samples: 130
  final_equals:
    ChemTreat_NaCl_Valve_Sts: 0
    ChemTreat_NaOCl_Valve_Sts: 0
    P2_Selected: 0
    RW_Pump_Sts: 0

