scenario_id: "wt-attack-sensor-rw-refill-spoof"
process_id: "WT-P1"
description: "Attack: spoof raw-water level low enough to force PR refill valve opening during runtime"
duration_sec: 40
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - { time_sec: 5, action: hmi_start }
  - time_sec: 15
    action:
      type: set_sensor
      name: RW_Tank_Level
      value: 400
  - { time_sec: 30, action: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING]
  event_count:
    hmi_start: 1
    hmi_stop: 1
  events_lead_to_state:
    hmi_start: RUNNING
    hmi_stop: SHUTDOWN
  ever_nonzero:
    - RW_Tank_PR_Valve_Sts
  min_samples: 60
  final_equals:
    RW_Pump_Sts: 0
    RW_Pump_Flow: 0

reference_bundle: null
