scenario_id: "wt-attack-p2-select-chatter"
process_id: "WT-P2"
description: "Attack: repeated Process 2 selection chatter to create operator confusion"
duration_sec: 44
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 5
    action: { process_id: WT-P1, type: hmi_start }
  - time_sec: 8
    action: { process_id: WT-P2, type: select_process, active: true }
  - time_sec: 12
    action: { process_id: WT-P2, type: select_process, active: false }
  - time_sec: 16
    action: { process_id: WT-P2, type: select_process, active: true }
  - time_sec: 20
    action: { process_id: WT-P2, type: select_process, active: false }
  - time_sec: 24
    action: { process_id: WT-P2, type: select_process, active: true }
  - time_sec: 28
    action: { process_id: WT-P2, type: select_process, active: false }
  - time_sec: 32
    action: { process_id: WT-P1, type: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING]
  must_change:
    - P2_Selected
  event_count:
    hmi_start: 1
    hmi_stop: 1
  min_samples: 60
  final_equals:
    P2_Selected: 0
    RW_Pump_Sts: 0

