scenario_id: "wt-attack-hmi-chatter"
process_id: "WT-P1"
description: "Attack: repeated start and stop command chattering"
duration_sec: 45
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - { time_sec: 5, action: hmi_start }
  - { time_sec: 12, action: hmi_stop }
  - { time_sec: 18, action: hmi_start }
  - { time_sec: 25, action: hmi_stop }
  - { time_sec: 31, action: hmi_start }
  - { time_sec: 38, action: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING, SHUTDOWN]
  event_count:
    hmi_start: 3
    hmi_stop: 3
  events_lead_to_state:
    hmi_start: RUNNING
    hmi_stop: SHUTDOWN
  min_samples: 65
  final_equals:
    RW_Pump_Sts: 0
    RW_Pump_Flow: 0

reference_bundle: null
