scenario_id: "wt-readiness-p1-refill-response"
process_id: "WT-P1"
description: "Readiness: low raw-water margin startup should trigger refill response and recover cleanly"
duration_sec: 74
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 520
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - { time_sec: 5, action: hmi_start }
  - { time_sec: 54, action: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING]
  must_change:
    - RW_Tank_Level
    - UF_UFFT_Tank_Level
  ever_nonzero:
    - RW_Tank_PR_Valve_Sts
  event_count:
    hmi_start: 1
    hmi_stop: 1
  min_samples: 105
  final_equals:
    RW_Pump_Sts: 0

