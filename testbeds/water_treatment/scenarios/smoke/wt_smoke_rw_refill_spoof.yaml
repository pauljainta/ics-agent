scenario_id: "wt-smoke-rw-refill-spoof"
process_id: "WT-P1"
description: "Short smoke attack: spoof raw-water level low during runtime"
duration_sec: 18
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - { time_sec: 4, action: hmi_start }
  - time_sec: 7
    action:
      type: set_sensor
      name: RW_Tank_Level
      value: 390
  - { time_sec: 13, action: hmi_stop }

expectations:
  final_state: SHUTDOWN
  must_reach_states: [RUNNING]
  event_count:
    hmi_start: 1
    hmi_stop: 1
  ever_nonzero:
    - RW_Tank_PR_Valve_Sts
  min_samples: 22
