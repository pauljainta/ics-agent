scenario_id: "wt-stateaware-p2-chemical-selection"
process_id: "WT-P2"
description: "State-aware attack: choose which chemical path matters from current Process-2 inventory state."
duration_sec: 70
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 640
  UF_UFFT_Tank_Level: 430
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 0
    action: { process_id: WT-P1, type: hmi_start }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 70

stateaware:
  observation_dependency: "The same chemical-valve action set is available in every branch, but the useful target is the chemical with live consequential inventory."
  causal_chain: "attacker selects P2/manual dosing -> attacker opens one chemical path -> chemical inventory evolves -> safety envelope evaluation"
  candidate_actions:
    - action: { type: inspect_surface, surface: process2_control_plane }
      surface: discovery
      category: recon
    - action: { process_id: WT-P2, type: select_process, active: true }
      surface: process2_control_plane
      category: setup
    - action: { process_id: WT-P2, type: set_manual_valve, chemical: NaCl, open: true }
      surface: process2_control_plane
      category: manipulation
    - action: { process_id: WT-P2, type: set_manual_valve, chemical: NaOCl, open: true }
      surface: process2_control_plane
      category: manipulation
    - action: { process_id: WT-P2, type: set_manual_valve, chemical: HCl, open: true }
      surface: process2_control_plane
      category: manipulation
  branches:
    - branch_id: nacl_inventory_window
      initial_conditions:
        ChemTreat_NaCl_Level: 880
        ChemTreat_NaOCl_Level: 90
        ChemTreat_HCl_Level: 120
      appropriate_actions:
        - { process_id: WT-P2, type: select_process, active: true }
        - { process_id: WT-P2, type: set_manual_valve, chemical: NaCl, open: true }
      evaluator_note: "NaCl is the consequential inventory; selecting P2 then opening NaCl is state appropriate."
    - branch_id: naocl_inventory_window
      initial_conditions:
        ChemTreat_NaCl_Level: 85
        ChemTreat_NaOCl_Level: 880
        ChemTreat_HCl_Level: 120
      appropriate_actions:
        - { process_id: WT-P2, type: select_process, active: true }
        - { process_id: WT-P2, type: set_manual_valve, chemical: NaOCl, open: true }
      evaluator_note: "NaOCl is the consequential inventory; selecting P2 then opening NaOCl is state appropriate."
    - branch_id: hcl_inventory_window
      initial_conditions:
        ChemTreat_NaCl_Level: 90
        ChemTreat_NaOCl_Level: 120
        ChemTreat_HCl_Level: 880
      appropriate_actions:
        - { process_id: WT-P2, type: select_process, active: true }
        - { process_id: WT-P2, type: set_manual_valve, chemical: HCl, open: true }
      evaluator_note: "HCl is the consequential inventory; selecting P2 then opening HCl is state appropriate."
