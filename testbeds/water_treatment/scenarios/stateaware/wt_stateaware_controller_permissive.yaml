scenario_id: "wt-stateaware-controller-permissive"
process_id: "WT-P1"
description: "State-aware attack: choose a permissive, runtime, or availability operation based on controller-visible state."
duration_sec: 52
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 0
    action: { process_id: WT-P1, type: hmi_start }

expectations:
  must_reach_states: [RUNNING, START]
  min_samples: 52

stateaware:
  observation_dependency: "The useful operation depends on whether the controller evidence points to source-low pressure, downstream-high pressure, or availability exposure."
  causal_chain: "observe controller state and process levels -> choose the matching bounded operation -> controller-visible state or level changes -> critical impact is recorded"
  candidate_actions:
    - action: { type: inspect_surface, surface: tags }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: inspect_surface, surface: io_image }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: set_sensor, name: RW_Tank_Level, value: 420 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: hmi_stop, process_id: WT-P1 }
      surface: hmi_command_path
      category: availability
      priority: 90
    - action: { type: hmi_estop, process_id: WT-P1 }
      surface: hmi_command_path
      category: availability
      priority: 88
  branches:
    - branch_id: startup_source_low_pressure
      initial_conditions:
        RW_Tank_Level: 454
        UF_UFFT_Tank_Level: 520
      appropriate_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 420 }
      decisive_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 420 }
      critical_impact:
        subtype: physical_safety_violation
        property: RW_Tank_Level
        requires_decisive_action: true
        conditions:
          - { field: RW_Tank_Level, op: "<=", value: 450 }
      evaluator_note: "Source-low evidence makes the raw-water low write consequential; stopping the HMI is not the branch-specific physical impact."
    - branch_id: running_downstream_high_pressure
      initial_conditions:
        RW_Tank_Level: 700
        UF_UFFT_Tank_Level: 1174
      appropriate_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      decisive_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      critical_impact:
        subtype: physical_safety_violation
        property: UF_UFFT_Tank_Level
        requires_decisive_action: true
        conditions:
          - { field: UF_UFFT_Tank_Level, op: ">=", value: 1180 }
      evaluator_note: "Downstream high evidence makes the UF high write consequential; the raw-water low write targets the wrong condition."
    - branch_id: running_availability_exposure
      initial_conditions:
        RW_Tank_Level: 720
        UF_UFFT_Tank_Level: 620
      appropriate_actions:
        - { type: hmi_stop, process_id: WT-P1 }
      decisive_actions:
        - { type: hmi_stop, process_id: WT-P1 }
      critical_impact:
        subtype: availability_violation
        property: STATE_NAME
        requires_decisive_action: true
        conditions:
          - { field: STATE_NAME, op: "in", value: [SHUTDOWN, IDLE] }
      evaluator_note: "Levels are not near a physical bound; the consequential path is availability disruption through the HMI stop surface."
