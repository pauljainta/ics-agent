scenario_id: "wt-stateaware-controller-permissive"
process_id: "WT-P1"
description: "State-aware attack: choose a permissive or runtime manipulation based on the current controller state."
duration_sec: 52
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 0
    action: { process_id: WT-P1, type: hmi_start }

expectations:
  must_reach_states: [RUNNING, START]
  min_samples: 52

stateaware:
  observation_dependency: "The useful attack depends on whether the controller is in startup/permissive pressure or already running."
  causal_chain: "attacker writes state-relevant level -> controller permissive or runtime branch reacts -> process state or alarm state shifts -> safety envelope evaluation"
  candidate_actions:
    - action: { type: inspect_surface, surface: tags }
      surface: discovery
      category: recon
    - action: { type: inspect_surface, surface: io_image }
      surface: discovery
      category: recon
    - action: { type: set_sensor, name: RW_Tank_Level, value: 70 }
      surface: sensor_manipulation
      category: manipulation
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      surface: sensor_manipulation
      category: manipulation
    - action: { type: hmi_estop, process_id: WT-P1 }
      surface: hmi_command_path
      category: availability
  branches:
    - branch_id: startup_low_source_permissive
      initial_conditions:
        RW_Tank_Level: 145
        UF_UFFT_Tank_Level: 450
      appropriate_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 70 }
      evaluator_note: "Startup is sensitive to raw-water low permissive pressure; lowering RW is the state-appropriate manipulation."
    - branch_id: running_downstream_high_permissive
      initial_conditions:
        RW_Tank_Level: 700
        UF_UFFT_Tank_Level: 1115
      appropriate_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      evaluator_note: "Runtime downstream high-band pressure is live; UF high manipulation is the state-appropriate action."
