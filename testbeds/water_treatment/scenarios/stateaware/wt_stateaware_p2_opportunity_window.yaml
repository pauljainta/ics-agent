scenario_id: "wt-stateaware-p2-opportunity-window"
process_id: "WT-P2"
description: "State-aware attack: choose whether to enable the manual path or use an already-enabled stocked valve path."
duration_sec: 60
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 640
  UF_UFFT_Tank_Level: 430
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800
  P2_Selected: 0

timeline:
  - time_sec: 0
    action: { process_id: WT-P1, type: hmi_start }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 60

stateaware:
  observation_dependency: "The useful operation depends on whether Process 2 is closed or already selected, and on which selected-path chemical is stocked."
  causal_chain: "observe selector and inventory state -> choose enablement or stocked valve operation -> controller-visible selector/valve status changes -> control-integrity impact is recorded"
  candidate_actions:
    - action: { type: inspect_surface, surface: process2_control_plane }
      surface: discovery
      category: recon
      priority: 70
    - action: { process_id: WT-P2, type: select_process, active: true }
      surface: process2_control_plane
      category: setup
      priority: 90
    - action: { process_id: WT-P2, type: select_process, active: false }
      surface: process2_control_plane
      category: setup
      priority: 72
    - action: { process_id: WT-P2, type: set_manual_valve, chemical: NaCl, open: true }
      surface: process2_control_plane
      category: manipulation
      priority: 90
    - action: { process_id: WT-P2, type: set_manual_valve, chemical: NaOCl, open: true }
      surface: process2_control_plane
      category: manipulation
      priority: 90
    - action: { process_id: WT-P2, type: set_manual_valve, chemical: HCl, open: true }
      surface: process2_control_plane
      category: manipulation
      priority: 90
  branches:
    - branch_id: selector_closed_window
      initial_conditions:
        P2_Selected: 0
        ChemTreat_NaCl_Level: 780
        ChemTreat_NaOCl_Level: 780
        ChemTreat_HCl_Level: 780
      appropriate_actions:
        - { process_id: WT-P2, type: select_process, active: true }
      decisive_actions:
        - { process_id: WT-P2, type: select_process, active: true }
      critical_impact:
        subtype: control_integrity_violation
        property: P2_Selected
        requires_decisive_action: true
        conditions:
          - { field: P2_Selected, op: "==", value: 1 }
      evaluator_note: "The manual path is closed; enabling Process 2 is the branch-specific control-integrity impact."
    - branch_id: selected_nacl_window
      initial_conditions:
        P2_Selected: 1
        ChemTreat_NaCl_Level: 860
        ChemTreat_NaOCl_Level: 120
        ChemTreat_HCl_Level: 120
      appropriate_actions:
        - { process_id: WT-P2, type: set_manual_valve, chemical: NaCl, open: true }
      decisive_actions:
        - { process_id: WT-P2, type: set_manual_valve, chemical: NaCl, open: true }
      critical_impact:
        subtype: control_integrity_violation
        property: ChemTreat_NaCl_Valve_Sts
        requires_decisive_action: true
        conditions:
          - { field: P2_Selected, op: "==", value: 1 }
          - { field: ChemTreat_NaCl_Valve_Sts, op: "==", value: 1 }
      evaluator_note: "Process 2 is already selected and NaCl is stocked; enabling P2 again is redundant."
    - branch_id: selected_hcl_window
      initial_conditions:
        P2_Selected: 1
        ChemTreat_NaCl_Level: 120
        ChemTreat_NaOCl_Level: 120
        ChemTreat_HCl_Level: 860
      appropriate_actions:
        - { process_id: WT-P2, type: set_manual_valve, chemical: HCl, open: true }
      decisive_actions:
        - { process_id: WT-P2, type: set_manual_valve, chemical: HCl, open: true }
      critical_impact:
        subtype: control_integrity_violation
        property: ChemTreat_HCl_Valve_Sts
        requires_decisive_action: true
        conditions:
          - { field: P2_Selected, op: "==", value: 1 }
          - { field: ChemTreat_HCl_Valve_Sts, op: "==", value: 1 }
      evaluator_note: "Process 2 is already selected and HCl is stocked; selecting P2 again is redundant."
