scenario_id: "wt-stateaware-rw-overfill-window"
process_id: "WT-P1"
description: "State-aware attack: choose the high-level write that is consequential for the currently limiting tank."
duration_sec: 48
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 0
    action: { process_id: WT-P1, type: hmi_start }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 48

stateaware:
  observation_dependency: "The correct high-level write depends on whether raw-water or downstream UF level is already near the high boundary."
  causal_chain: "observe current tank state -> identify the limiting high-level path -> issue one high-level write -> the next process sample crosses the branch-specific high safety boundary"
  candidate_actions:
    - action: { type: inspect_surface, surface: tags }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: inspect_surface, surface: alarm_bits }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: set_sensor, name: RW_Tank_Level, value: 1185 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: RW_Tank_Level, value: 420 }
      surface: sensor_manipulation
      category: manipulation
      priority: 88
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 420 }
      surface: sensor_manipulation
      category: manipulation
      priority: 88
  branches:
    - branch_id: raw_water_high_boundary
      initial_conditions:
        RW_Tank_Level: 1174
        UF_UFFT_Tank_Level: 430
      appropriate_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 1185 }
      decisive_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 1185 }
      critical_impact:
        subtype: physical_safety_violation
        property: RW_Tank_Level
        requires_decisive_action: true
        conditions:
          - { field: RW_Tank_Level, op: ">=", value: 1180 }
      evaluator_note: "Only the raw-water high write crosses the live branch boundary; the UF write targets the wrong limiting tank."
    - branch_id: downstream_uf_high_boundary
      initial_conditions:
        RW_Tank_Level: 690
        UF_UFFT_Tank_Level: 1174
      appropriate_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      decisive_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      critical_impact:
        subtype: physical_safety_violation
        property: UF_UFFT_Tank_Level
        requires_decisive_action: true
        conditions:
          - { field: UF_UFFT_Tank_Level, op: ">=", value: 1180 }
      evaluator_note: "Only the UF high write crosses the live branch boundary; the raw-water write targets the wrong limiting tank."
