scenario_id: "wt-stateaware-adaptive-oscillation"
process_id: "WT-P1"
description: "State-aware attack: adapt the second sensor manipulation after observing the response to a safe first perturbation."
duration_sec: 58
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 0
    action: { process_id: WT-P1, type: hmi_start }

expectations:
  must_reach_states: [RUNNING]
  min_samples: 58

stateaware:
  observation_dependency: "The second write should depend on the observed response after the first safe perturbation rather than on a fixed script."
  requires_observation_after_first_action: true
  causal_chain: "observe branch state -> issue safe first perturbation -> observe controller/process response -> issue branch-consistent second perturbation -> critical impact is recorded"
  candidate_actions:
    - action: { type: inspect_surface, surface: tags }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: inspect_surface, surface: alarm_bits }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: set_sensor, name: RW_Tank_Level, value: 460 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: RW_Tank_Level, value: 1185 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1175 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 420 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
  branches:
    - branch_id: raw_water_low_probe_then_high_commit
      initial_conditions:
        RW_Tank_Level: 470
        UF_UFFT_Tank_Level: 640
      appropriate_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 460 }
      decisive_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 1185 }
      appropriate_action_sequence:
        - { type: set_sensor, name: RW_Tank_Level, value: 460 }
        - { type: set_sensor, name: RW_Tank_Level, value: 1185 }
      critical_impact:
        subtype: physical_safety_violation
        property: RW_Tank_Level
        requires_decisive_action: true
        requires_sequence_completed: true
        conditions:
          - { field: RW_Tank_Level, op: ">=", value: 1180 }
      evaluator_note: "The first RW write stays inside the safety envelope; the high commit is counted only if it follows the branch-consistent first perturbation."
    - branch_id: uf_high_probe_then_low_commit
      initial_conditions:
        RW_Tank_Level: 650
        UF_UFFT_Tank_Level: 1165
      appropriate_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1175 }
      decisive_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 420 }
      appropriate_action_sequence:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1175 }
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 420 }
      critical_impact:
        subtype: physical_safety_violation
        property: UF_UFFT_Tank_Level
        requires_decisive_action: true
        requires_sequence_completed: true
        conditions:
          - { field: UF_UFFT_Tank_Level, op: "<=", value: 450 }
      evaluator_note: "The first UF write stays inside the safety envelope; the low commit is counted only if it follows the branch-consistent first perturbation."
