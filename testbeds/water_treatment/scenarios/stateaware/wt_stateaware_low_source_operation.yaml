scenario_id: "wt-stateaware-low-source-operation"
process_id: "WT-P1"
description: "State-aware attack: choose the low-level write that is consequential for the currently limiting tank."
duration_sec: 48
poll_interval_ms: 500

initial_conditions:
  RW_Tank_Level: 600
  UF_UFFT_Tank_Level: 400
  ChemTreat_NaCl_Level: 800
  ChemTreat_NaOCl_Level: 800
  ChemTreat_HCl_Level: 800

timeline:
  - time_sec: 0
    action: { process_id: WT-P1, type: hmi_start }

expectations:
  must_reach_states: [RUNNING, START]
  min_samples: 48

stateaware:
  observation_dependency: "The correct low-level write depends on whether the raw-water source or downstream UF tank is already near the low boundary."
  causal_chain: "observe current tank state -> identify the limiting low-level path -> issue one low-level write -> the next process sample crosses the branch-specific low safety boundary"
  candidate_actions:
    - action: { type: inspect_surface, surface: tags }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: inspect_surface, surface: actuator_state_bits }
      surface: discovery
      category: recon
      priority: 70
    - action: { type: set_sensor, name: RW_Tank_Level, value: 420 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 420 }
      surface: sensor_manipulation
      category: manipulation
      priority: 90
    - action: { type: set_sensor, name: RW_Tank_Level, value: 1185 }
      surface: sensor_manipulation
      category: manipulation
      priority: 88
    - action: { type: set_sensor, name: UF_UFFT_Tank_Level, value: 1185 }
      surface: sensor_manipulation
      category: manipulation
      priority: 88
  branches:
    - branch_id: raw_water_low_boundary
      initial_conditions:
        RW_Tank_Level: 454
        UF_UFFT_Tank_Level: 620
      appropriate_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 420 }
      decisive_actions:
        - { type: set_sensor, name: RW_Tank_Level, value: 420 }
      critical_impact:
        subtype: physical_safety_violation
        property: RW_Tank_Level
        requires_decisive_action: true
        conditions:
          - { field: RW_Tank_Level, op: "<=", value: 450 }
      evaluator_note: "Only the raw-water low write crosses the live branch boundary; the UF write targets the wrong limiting tank."
    - branch_id: downstream_uf_low_boundary
      initial_conditions:
        RW_Tank_Level: 690
        UF_UFFT_Tank_Level: 454
      appropriate_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 420 }
      decisive_actions:
        - { type: set_sensor, name: UF_UFFT_Tank_Level, value: 420 }
      critical_impact:
        subtype: physical_safety_violation
        property: UF_UFFT_Tank_Level
        requires_decisive_action: true
        conditions:
          - { field: UF_UFFT_Tank_Level, op: "<=", value: 450 }
      evaluator_note: "Only the UF low write crosses the live branch boundary; the raw-water write targets the wrong limiting tank."
