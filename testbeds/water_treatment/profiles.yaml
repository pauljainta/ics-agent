  plcbench_matched_treatment_attacker:
    role: attacker
    family: agentic
    mode: online
    # Matches gray_box_attacker's world-facing capabilities exactly (same
    # knowledge_mode, action menu, observations, grants); differs ONLY in the
    # PLCBench decision scaffold -- a three-part prompt and deterministic history
    # compaction -- selected by `scaffold`. See docs/baselines/.
    scaffold: plcbench_matched
    knowledge_mode: gray_box
    allowed_action_types:
    - hmi_start
    - hmi_stop
    - hmi_estop
    - select_process
    - set_manual_valve
    - set_sensor
    - noop
    abort_on_backend_error: true
    llm:
      # Runs on a local Ollama server (CPU/Metal, no CUDA). model_id is the one
      # line to change when moving to a larger model; both arms must share it
      # (see gray_box_ollama_treatment_attacker). Frozen deployment open item.
      backend: ollama
      host: http://localhost:11434
      model_id: llama3.1:latest
      prompt_file: testbeds/water_treatment/prompts/plcbench_matched_attacker.md
      local_files_only: true
      require_cuda: false
      quantization: bf16
      temperature: 0
      # Raised from 160: a PLCBench-style JSON decision with brief reasoning
      # needs headroom; 160 is the candidate-ID cap the source method would be
      # starved by. The controlled comparison must use the SAME frozen ceiling on
      # BOTH arms -- open model-freeze item in plcbench_conformance.md.
      max_new_tokens: 512
      compaction:
        soft_budget: 2048
        target_budget: 1536
        protected_k: 6
    memory:
      observation_window: 10
      decision_window: 8
      action_window: 12
      alert_window: 8
      summary_window: 6
      attacker_candidate_window: 6
    action_cooldown_sec: 1.0
    reasoning_cooldown_sec: 6.0
    reasoning_refresh_sec: 12.0
  gray_box_ollama_treatment_attacker:
    role: attacker
    family: agentic
    mode: online
    # The ICS-agent comparator arm on the SAME frozen Ollama deployment as
    # plcbench_matched_treatment_attacker. Identical capabilities; no PLCBench
    # scaffold -- this is the stock gray-box agentic condition. The two together
    # are the controlled matched pair (only the scaffold differs).
    knowledge_mode: gray_box
    allowed_action_types:
    - hmi_start
