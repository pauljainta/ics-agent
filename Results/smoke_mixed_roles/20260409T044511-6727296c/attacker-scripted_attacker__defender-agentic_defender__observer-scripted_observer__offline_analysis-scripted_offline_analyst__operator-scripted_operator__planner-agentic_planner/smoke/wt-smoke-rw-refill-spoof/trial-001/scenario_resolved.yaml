catalog_id: smoke/wt-smoke-rw-refill-spoof
scenario_id: wt-smoke-rw-refill-spoof
suite: smoke
execution_path: configs/scenarios/smoke/wt_smoke_rw_refill_spoof.yaml
execution:
  scenario_id: wt-smoke-rw-refill-spoof
  process_id: WT-P1
  description: 'Short smoke attack: spoof raw-water level low during runtime'
  duration_sec: 18
  poll_interval_ms: 500
  initial_conditions:
    RW_Tank_Level: 600
    UF_UFFT_Tank_Level: 400
    ChemTreat_NaCl_Level: 800
    ChemTreat_NaOCl_Level: 800
    ChemTreat_HCl_Level: 800
  timeline:
  - time_sec: 4
    action: hmi_start
  - time_sec: 7
    action:
      type: set_sensor
      name: RW_Tank_Level
      value: 390
  - time_sec: 13
    action: hmi_stop
  expectations:
    final_state: SHUTDOWN
    must_reach_states:
    - RUNNING
    event_count:
      hmi_start: 1
      hmi_stop: 1
    ever_nonzero:
    - RW_Tank_PR_Valve_Sts
    min_samples: 22
metadata:
  name: Short RW Refill Spoof Smoke Attack
  intent: Provide a short attack scenario for core combination-matrix smoke testing.
  prerequisites:
  - The configured runtime backend can launch locally.
  - The results root is writable.
  start_state:
    source: execution.initial_conditions
    mode: online
  attacker_actions:
  - Start the plant and spoof raw-water level low once the process is running.
  defender_responses:
  - Raise an alert and optionally stop the plant.
  expected_outcomes:
  - Detection and mitigation timing are available from a short run.
  success_conditions:
  - Observations, actions, metrics, and summaries are created under Results.
  failure_conditions:
  - The smoke run fails to produce artifacts.
  required_metrics:
  - time_to_detection_sec
  - time_to_mitigation_sec
  - false_positive_rate
  - false_negative_rate
  - safety_violation_count
  - recovery_success_rate
  - decision_correctness
  - diagnosis_accuracy
  - system_stability_indicators
  - operator_workload
  ground_truth:
    incident_type: attack
    mitigation_actions:
    - hmi_stop
    - hmi_estop
    incident_start_time_sec: 7
    expected_diagnosis: raw_water_low_or_spoof
    expected_defender_actions:
    - hmi_stop
  safety_bounds:
    RW_Tank_Level:
      min: 0
      max: 1200
    UF_UFFT_Tank_Level:
      min: 0
      max: 1200
    ChemTreat_NaCl_Level:
      min: 0
      max: 1000
    ChemTreat_NaOCl_Level:
      min: 0
      max: 1000
    ChemTreat_HCl_Level:
      min: 0
      max: 1000
  tags:
  - smoke
  - fast
  role_bindings:
    operator:
    - 0
    attacker:
    - 1
    - 2
