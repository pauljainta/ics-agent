catalog_id: smoke/wt-smoke-p1-short-nominal
scenario_id: wt-smoke-p1-short-nominal
suite: smoke
execution_path: configs/scenarios/smoke/wt_smoke_p1_short_nominal.yaml
execution:
  scenario_id: wt-smoke-p1-short-nominal
  process_id: WT-P1
  description: Short nominal startup and shutdown smoke test
  duration_sec: 16
  poll_interval_ms: 500
  initial_conditions:
    RW_Tank_Level: 620
    UF_UFFT_Tank_Level: 420
    ChemTreat_NaCl_Level: 800
    ChemTreat_NaOCl_Level: 800
    ChemTreat_HCl_Level: 800
  timeline:
  - time_sec: 4
    action: hmi_start
  - time_sec: 11
    action: hmi_stop
  expectations:
    final_state: SHUTDOWN
    must_reach_states:
    - RUNNING
    event_count:
      hmi_start: 1
      hmi_stop: 1
    min_samples: 20
metadata:
  name: Short P1 Nominal Smoke Run
  intent: Quickly verify startup, observation capture, and clean shutdown on the live
    OpenPLC path.
  prerequisites:
  - The configured runtime backend can launch locally.
  - The results root is writable.
  start_state:
    source: execution.initial_conditions
    mode: online
  attacker_actions: []
  defender_responses:
  - Remain passive unless a safety threshold is crossed.
  expected_outcomes:
  - The plant reaches RUNNING and then SHUTDOWN within the short window.
  success_conditions:
  - Observations, actions, metrics, and summaries are created under Results.
  failure_conditions:
  - The smoke run fails to produce artifacts.
  required_metrics:
  - time_to_detection_sec
  - time_to_mitigation_sec
  - false_positive_rate
  - false_negative_rate
  - safety_violation_count
  - recovery_success_rate
  - decision_correctness
  - diagnosis_accuracy
  - system_stability_indicators
  - operator_workload
  ground_truth:
    incident_type: nominal
    mitigation_actions:
    - hmi_stop
    - hmi_estop
    - select_process
  safety_bounds:
    RW_Tank_Level:
      min: 0
      max: 1200
    UF_UFFT_Tank_Level:
      min: 0
      max: 1200
    ChemTreat_NaCl_Level:
      min: 0
      max: 1000
    ChemTreat_NaOCl_Level:
      min: 0
      max: 1000
    ChemTreat_HCl_Level:
      min: 0
      max: 1000
  tags:
  - smoke
  - fast
  role_bindings:
    system:
    - 0
    - 1
